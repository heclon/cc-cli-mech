[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mech"
version = "0.1.0"
description = "Daily-bar data and backtesting toolkit for mechanical trading strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["yfinance"]

[tool.setuptools.packages.find]
where = ["src"]
